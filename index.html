    <!-- Pré-conecta nos CDNs de fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Pré-carrega o CSS da fonte com prioridade alta -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />

    <script id="studoo-structured-data" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://studoo.com.br/#organization",
            "name": "Studoo",
            "url": "https://studoo.com.br/",
            "logo": "https://studoo.com.br/favicon-512.png"
          },
          {
            "@type": "WebSite",
            "@id": "https://studoo.com.br/#website",
            "name": "Studoo",
            "url": "https://studoo.com.br/",
            "inLanguage": "pt-BR",
            "publisher": { "@id": "https://studoo.com.br/#organization" }
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://studoo.com.br/#software",
            "name": "Studoo",
            "url": "https://studoo.com.br/",
            "description": "Software de gestão para professores particulares organizarem alunos, agenda, registros de aula, cobranças e relatórios.",
            "applicationCategory": "BusinessApplication",
            "applicationSubCategory": "Gestão para professores particulares",
            "operatingSystem": "Web",
            "inLanguage": "pt-BR",
            "image": "https://studoo.com.br/landing/dashboard.png",
            "publisher": { "@id": "https://studoo.com.br/#organization" },
            "offers": [
              {
                "@type": "Offer",
                "name": "Studoo mensal",
                "price": "39.00",
                "priceCurrency": "BRL",
                "availability": "https://schema.org/InStock",
                "url": "https://studoo.com.br/#pricing"
              },
              {
                "@type": "Offer",
                "name": "Studoo anual",
                "price": "390.00",
                "priceCurrency": "BRL",
                "availability": "https://schema.org/InStock",
                "url": "https://studoo.com.br/#pricing"
              }
            ]
          }
        ]
      }
    </script>

    <!-- Anti-FOUC: aplica tema (dark/light) antes do bundle React rodar -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("studoo-theme");
          var prefersLight =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches;
          var t = saved === "light" || saved === "dark" ? saved : prefersLight ? "light" : "dark";
          document.documentElement.classList.add(t === "light" ? "light" : "dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
