<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-dark-512.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/favicon-512.png" />
    <link rel="shortcut icon" href="/favicon-32.png" />
    <meta name="theme-color" content="#E7A13A" />
    <meta name="application-name" content="Studoo" />

    <!-- Pré-conecta nos CDNs de fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Pré-carrega o CSS da fonte com prioridade alta -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />

    <title>Studoo · Gestão pra professores</title>

    <!-- Anti-FOUC: aplica tema (dark/light) antes do bundle React rodar -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("studoo-theme");
          var prefersLight =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches;
          var t = saved === "light" || saved === "dark" ? saved : prefersLight ? "light" : "dark";
          document.documentElement.classList.add(t === "light" ? "light" : "dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
